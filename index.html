<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crandall Software LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crandall Software LLC — Independent software contracting.">
  <!-- Favicon link -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f4f7fa;
      color: #1e2732;
      font-family: 'Segoe UI', 'Fira Sans', Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main {
      text-align: center;
      padding: 0 1rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #245e8e;
      margin-bottom: 0.7em;
      letter-spacing: 0.01em;
    }
    p {
      font-size: 1.08rem;
      color: #385168;
      margin-top: 0.2em;
      margin-bottom: 1.5em;
      line-height: 1.5;
    }
    .email {
      font-size: 1.08rem;
      margin-bottom: 1.2em;
      font-weight: 500;
    }
    .email a {
      color: #245e8e;
      text-decoration: none;
      border-bottom: 1px dotted #adb7bf;
      transition: border-color 0.2s, box-shadow 0.15s, background 0.15s, color 0.18s, outline 0.14s;
      padding: 2px 4px;
    }
    .email a:hover,
    .email a:focus {
      border-bottom: 1px solid #245e8e;
      color: #18426d;
      outline: none;
    }
    .links {
      margin-top: 1.2em;
      margin-bottom: 2em;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 0.7em;
    }
    .chip-link {
      display: inline-block;
      padding: 0.18em 0.85em 0.16em 0.78em;
      border-radius: 14px;
      background: #eaf2fb;
      color: #245e8e;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: 0 1px 4px #b3c7e614;
      text-decoration: none;
      border: 1px solid #d7e5f6;
      transition: background 0.16s, color 0.13s, box-shadow 0.13s, border-color 0.12s, transform 0.13s;
      cursor: pointer;
      letter-spacing: 0.01em;
    }
    .chip-link:hover,
    .chip-link:focus {
      background: #e2eefd;
      color: #18426d;
      box-shadow: 0 2.5px 10px 0 rgba(36,94,142,0.10);
      border-color: #c7d9f0;
      transform: translateY(-0.5px) scale(1.01);
      text-decoration: none;
      outline: none;
    }
    .logo-icon-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.3em;
    }
    .logo-icon {
      width: 52px;
      height: 52px;
      max-width: 18vw;
      max-height: 18vw;
      border-radius: 15px;
      background: none;
      /* Slight shadow under the icon */
      box-shadow: 0 4px 16px 0 rgba(45,56,85, 0.18), 0 1px 3px 0 rgba(45,56,85, 0.09);
    }
    .footer {
      font-size: 0.96rem;
      color: #a0b4c1;
      margin-top: 2.5em;
      letter-spacing: 0.01em;
      text-align: center;
      user-select: none;
    }
    @media (max-width: 570px) {
      h1 { font-size: 1.45rem; }
      p, .email, .footer, .links .chip-link { font-size: 0.96rem; }
      .links { gap: 0.48em; }
      .chip-link { padding: 0.14em 0.66em 0.14em 0.66em; }
      .logo-icon { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-icon-wrapper">
      <svg class="logo-icon" viewBox="0 0 64 64" aria-label="Crandall Software Logo">
        <rect width="64" height="64" rx="16" fill="#245e8e"/>
        <circle cx="32" cy="32" r="22" fill="#eaf2fb"/>
        <text x="32" y="41" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" fill="#245e8e" font-weight="bold">CS</text>
      </svg>
    </div>
    <h1>Crandall Software LLC</h1>
    <p>
      Independent software contracting.
    </p>
    <div class="email">
      <a href="mailto:logan@crandall.dev">logan@crandall.dev</a>
    </div>
    <div class="links">
      <a class="chip-link" href="https://www.linkedin.com/in/logan-crandall" target="_blank" rel="noopener">LinkedIn</a>
      <a class="chip-link" href="https://github.com/link00000000" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>
  <div class="footer">&copy; 2025 Crandall Software LLC</div>
</body>
</html>
