<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crandall Software LLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crandall Software LLC — Independent software contracting.">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f4f7fa;
      color: #1e2732;
      font-family: 'Segoe UI', 'Fira Sans', Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main {
      text-align: center;
      padding: 0 1rem;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      color: #245e8e;
      margin-bottom: 0.7em;
      letter-spacing: 0.01em;
    }
    p {
      font-size: 1.08rem;
      color: #385168;
      margin-top: 0.2em;
      margin-bottom: 1.5em;
      line-height: 1.5;
    }
    .email {
      font-size: 1.08rem;
      margin-bottom: 1.2em;
      font-weight: 500;
    }
    .email a {
      color: #245e8e;
      text-decoration: none;
      border-bottom: 1px dotted #adb7bf;
      transition: border-color 0.2s;
      padding: 0 1px;
    }
    .email a:hover,
    .email a:focus {
      border-bottom: 1px solid #245e8e;
    }
    .links {
      margin-top: 1.2em;
      margin-bottom: 2em;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 0.7em;
    }
    .chip-link {
      display: inline-block;
      padding: 0.18em 0.85em 0.16em 0.78em;
      border-radius: 14px;
      background: #eaf2fb;
      color: #245e8e;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: 0 1px 4px #b3c7e614;
      text-decoration: none;
      border: 1px solid #d7e5f6;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
      letter-spacing: 0.01em;
    }
    .chip-link:hover,
    .chip-link:focus {
      background: #f5fafd;
      color: #18426d;
      box-shadow: 0 2px 8px #bddcf718;
      border-color: #b5cfea;
      text-decoration: none;
      outline: none;
    }
    .footer {
      font-size: 0.96rem;
      color: #a0b4c1;
      margin-top: 2.5em;
      letter-spacing: 0.01em;
      text-align: center;
      user-select: none;
    }
    @media (max-width: 570px) {
      h1 { font-size: 1.45rem; }
      p, .email, .footer, .links .chip-link { font-size: 0.96rem; }
      .links { gap: 0.48em; }
      .chip-link { padding: 0.14em 0.66em 0.14em 0.66em; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Crandall Software LLC</h1>
    <p>
      Independent software contracting.
    </p>
    <div class="email">
      <a href="mailto:logan@crandall.dev">logan@crandall.dev</a>
    </div>
    <div class="links">
      <a class="chip-link" href="https://www.linkedin.com/in/logan-crandall" target="_blank" rel="noopener">LinkedIn</a>
      <a class="chip-link" href="https://github.com/link00000000" target="_blank" rel="noopener">GitHub</a>
    </div>
  </main>
  <div class="footer">\&copy; 2025 Crandall Software LLC</div>
</body>
</html>
